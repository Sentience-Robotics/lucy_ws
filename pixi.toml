[workspace]
name = "lucy_ws"
description = "Lucy / InMoov ROS 2 Jazzy workspace (RoboStack + Pixi)"
channels = [
  "https://prefix.dev/conda-forge",
  "https://prefix.dev/robostack-jazzy",
]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

# --- shared build / tooling (default feature) ---
[dependencies]
python = "*"
compilers = "*"
binutils = "*"
cmake = "<4"
ninja = "*"
pkg-config = "*"

colcon-common-extensions = "*"

nodejs = ">=20"
yarn = "*"

pytest = "*"
pytest-cov = "*"
pytest-mock = "*"

# --- ROS Jazzy stack (RoboStack channel) ---
[feature.ros]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.ros.dependencies]
# Pin distro mutex so all RoboStack packages come from the same rebuild cycle.
# See: https://github.com/RoboStack/ros-jazzy/issues/125
ros2-distro-mutex = "0.15.*"
ros-jazzy-desktop = "*"
ros-jazzy-ros-gz = "*"
ros-jazzy-rosbridge-suite = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
ros-jazzy-gz-ros2-control = "*"
ros-jazzy-simulation-interfaces = "*"
ros-jazzy-backward-ros = "*"

# RealSense is not a Pixi dependency — build locally when needed:
#   ./scripts/build_local_realsense.sh  (or LUCY_BUILD_REALSENSE=1 ./install.sh)

[feature.ros.target.osx-arm64.dependencies]
pygraphviz = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"

[feature.ros.target.osx-64.dependencies]
pygraphviz = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"

[feature.ros.target.osx-arm64.activation]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

[feature.ros.target.osx-64.activation]
env = { RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp" }

# --- colcon build tasks (RoboStack Getting Started pattern) ---
[feature.build.target.unix.tasks]
build = { cmd = "rm -rf build/camera_ros install/camera_ros 2>/dev/null || true; colcon build --symlink-install --cmake-args -GNinja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY", inputs = ["src"] }
build-release = "colcon build --cmake-args -GNinja -DCMAKE_BUILD_TYPE=Release -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
clean = "rm -rf build install log"
test = { cmd = "colcon test", depends-on = ["build"] }

[feature.build.target.win-64.tasks]
build = { cmd = "rm -rf build/camera_ros install/camera_ros 2>/dev/null || true; colcon build --merge-install --cmake-args -GNinja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY", inputs = ["src"] }
build-release = "colcon build --merge-install --cmake-args -GNinja -DCMAKE_BUILD_TYPE=Release -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
clean = "rm -rf build install log"
test = { cmd = "colcon test", depends-on = ["build"] }

[feature.panel.tasks]
panel-install = { cmd = "yarn install", cwd = "src/lucy_control_panel" }
panel-dev = { cmd = "yarn dev", cwd = "src/lucy_control_panel" }
panel-build = { cmd = "yarn build", cwd = "src/lucy_control_panel" }

[feature.dev.tasks]
doctor = "ros2 doctor --report"
launch-sim = "ros2 launch lucy_bringup lucy.launch.py gazebo:=true rviz:=true"

# --- platform-specific host packages ---
[target.linux.dependencies]
libgl-devel = "*"
gstreamer = "*"

[target.unix.dependencies]
tmux = "*"

# --- activation: colcon overlay + Gazebo plugin path ---
[target.unix.activation]
scripts = ["install/setup.bash"]
env = { GZ_SIM_SYSTEM_PLUGIN_PATH = "$CONDA_PREFIX/lib" }

[target.win.activation]
scripts = ["install/setup.bat"]

[environments]
default = { features = ["ros", "build", "panel", "dev"] }
