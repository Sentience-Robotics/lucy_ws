# Full workspace install (clone + Docker + colcon + yarn) and a non-interactive launch smoke test.
# Uses DEV=false (HTTPS-friendly clones via git url.insteadOf); requires dependency repos readable by GITHUB_TOKEN.
# matrix.dockerfile_variant=macos exercises Dockerfile.humble.macos (linux/arm64) via QEMU on ubuntu-latest.

name: Install and launch

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  install-and-launch:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.dockerfile_variant }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dockerfile_variant: [default, macos]
    env:
      DEV: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (linux/arm64 Docker builds on amd64 runner)
        if: matrix.dockerfile_variant == 'macos'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.dockerfile_variant == 'macos'
        uses: docker/setup-buildx-action@v3

      - name: Drop workspace .env if present (use DEV from workflow env only)
        run: rm -f .env .env.local || true

      - name: Clone private deps over HTTPS with GITHUB_TOKEN
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install (clone + Docker image + rosdep + colcon + yarn)
        run: |
          chmod +x install.sh launch_lucy.sh
          if [ "${{ matrix.dockerfile_variant }}" = macos ]; then
            ./install.sh --macos
          else
            ./install.sh
          fi

      - name: Launch smoke test (headless, no TTY)
        run: |
          if [ "${{ matrix.dockerfile_variant }}" = macos ]; then
            ./launch_lucy.sh --macos --headless ros2 doctor --report
          else
            ./launch_lucy.sh --headless ros2 doctor --report
          fi
