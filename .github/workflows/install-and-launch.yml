# Full workspace install (clone + Docker + colcon + yarn) and a non-interactive launch smoke test.
# Uses DEV=false (HTTPS-friendly clones via git url.insteadOf); requires dependency repos readable by GITHUB_TOKEN.
# variant=arm uses a GitHub-hosted ARM64 runner (ubuntu-24.04-arm) and ./install.sh --arm; image arch is verified after build.

name: Install and launch

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  install-and-launch:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.variant }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            runner: ubuntu-latest
            use_arm_install: false
          - variant: arm
            runner: ubuntu-24.04-arm
            use_arm_install: true
    env:
      DEV: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Drop workspace .env if present (use DEV from workflow env only)
        run: rm -f .env .env.local || true

      - name: Clone private deps over HTTPS with GITHUB_TOKEN
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install (clone + Docker image + rosdep + colcon + yarn)
        run: |
          chmod +x install.sh launch_lucy.sh
          if [ "${{ matrix.use_arm_install }}" = true ]; then
            ./install.sh --arm
          else
            ./install.sh
          fi

      - name: Verify Lucy image is linux/arm64
        if: matrix.use_arm_install == true
        run: |
          osarch=$(docker image inspect lucy_ros2_control:humble --format '{{.Os}}/{{.Architecture}}')
          echo "lucy_ros2_control:humble -> ${osarch}"
          case "${osarch}" in
            linux/arm64) echo "OK: linux/arm64 image" ;;
            *)
              echo "::error::Expected linux/arm64 after ./install.sh --arm on ubuntu-24.04-arm, got ${osarch}"
              exit 1
              ;;
          esac

      - name: Verify Lucy image is linux/amd64
        if: matrix.use_arm_install == false
        run: |
          osarch=$(docker image inspect lucy_ros2_control:humble --format '{{.Os}}/{{.Architecture}}')
          echo "lucy_ros2_control:humble -> ${osarch}"
          case "${osarch}" in
            linux/amd64) echo "OK: linux/amd64 image" ;;
            *)
              echo "::error::Expected linux/amd64 after ./install.sh on ubuntu-latest, got ${osarch}"
              exit 1
              ;;
          esac

      - name: Launch smoke test (headless, no TTY)
        run: ./launch_lucy.sh --headless ros2 doctor --report
